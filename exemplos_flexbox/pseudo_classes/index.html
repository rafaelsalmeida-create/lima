<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Pseudo-Classes</h1>
    <section>
        <h3>formulario</h3>
        <input type="text" placeholder="selecione para ver o: focus">
        <button>botão com :hover</button>
    </section>
    <section>
        <p>este é o primeiro parágrafo( deve ficar em negrito pelo:first-child)</p>
    </section>
    <section>
        <h3>lista de itens</h3>
        <ul>
            <li>item 1</li>
            <li>item 2</li>
            <li>ultimo item (deve ficar em vermelho pelo: last-child)</li>
        </ul>
    </section>
    <section>
        <h3>tabela</h3>
        <table>
            <tr>
                <th>Nome</th>
                <th>Idade</th>
            </tr>
            <tr>
                <td>João</td>
                <td>25</td>
            </tr>
            <tr>
                <td>Maria</td>
                <td>30</td>
            </tr>
        </table>
    </section>
</body>
</html>
