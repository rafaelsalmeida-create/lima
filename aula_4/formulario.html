<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1, initial-scale=1.0">
  <title>Formulario</title>
</head>
<body>
  <section>
    <h2>Formulario</h2>
    <form action="cadastro.php" method="post">
      <label>Nome:</label>
      <input type="text" name="nome" placeholder="Digite seu nome">
    </p>
    <p>
      <label>Senha:</label>
      <input type="password" name="senha" required maxlength="8" placeholder="Digite sua senha">
    </p>

    <p>
      <label>Telefone:</label>
      <input type="tel" name="telefone" placeholder="Digite seu telefone" pattern="[0-9]{2}-[0-9]{5}-[0-9]{4}" title="Digite o telefone no formato 00-00000-0000">
    </p>

    <p>
      <label>Cep:</label>
      <input type="text" name="cep" placeholder="Digite seu Cep" pattern="[0-9]{5}-[0-9]{3}" title="Digite o Cep no formato 00000-000">
    </p>

    <p>
      <label>email:</label>
      <input type="email" name="email" placeholder="Digite seu email">
    </p>
  </section>

  <p>
    <p><label>Sobre voce:</label></p>
    <textarea name="bio" rows="10" cols="100"></textarea disabled>
  </p>

  <p>
    <input type="radio" name="sexo" value="masculino">Masculino
    <input type="radio" name="sexo" value="feminino">Feminino
  </p>

  <p><label>Interesses:</label></p>
  <p>
    <input type="checkbox" name="interesses[]" value="esportes">Esportes
    <input type="checkbox" name="interesses[]" value="musica">Musica
    <input type="checkbox" name="interesses[]" value="filmes">Artes

    <p><label>País:</label></p>
    <select name="pais">
      <option value="brasil">Brasil</option>
      <option value="venezuela">Venezuela</option>
      <option value="china">China</option>
    </select>

    <p><label>Foto de perfil:</label></p>
    <input type="file" name="foto">

        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
      </form>
    </section>
     
    </select>
</body>
</html>
